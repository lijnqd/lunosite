<!doctype html>

<html>
    <head>
        <style>
            html, body {
                margin: 0;
                padding: 0;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            :root {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                box-sizing: border-box;
                -webkit-font-smoothing: inherit;
            }

            h1, h2, h3, h4, h5, h6, p, figure {
                margin: 0;
            }

            body, input, textarea, select, button {
                font-size: 12px;
                font-family: sans-serif;
            }
        </style>
    </head>
    <body>
        <style>@font-face{font-family:'Sometype Mono';font-weight:400;font-display:swap;src:url(/assets/fonts/sometype-mono-latin-500-normal.woff2) format('woff2')}</style>
<style>
  :root{color-scheme:normal}
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background: transparent; 
  }
  canvas { 
    display: block; 
    width: 100%; 
    height: 100%; 
    cursor: pointer;
  }
</style>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

/* ══ ASCII wake, on the lunö mascot ══════════════════════════
   Adapted from Bencho's "ASCII wake" (MIT, bencho.dev/licence).
   The mascot is drawn in ink dots, the dots shrinking toward its
   outline like a halftone. The pointer drags a wake through it:
   right under the hand the characters thicken to their densest
   and stay that way while the hand rests, and along the path it
   came from they thin back out, @ to # to + to a dot, as the wake
   cools. The characters run from the hand and spring back behind it. Press
   and a ring goes out from the press.

   ── A GRID OF NUMBERS, THEN A RAMP ──────────────────────
   Every cell holds one number. The hand adds to it along the
   line it moved, so a fast stroke leaves no gaps; every frame the
   whole grid cools by the same fraction. The number picks a
   character off a ramp of glyphs, lightest to densest. That is the
   whole effect — a field, then a palette, with characters where a
   heat map has colours.

   ── THE SHIMMER ─────────────────────────────────────────
   A cell that is in the wake picks its glyph with a little noise,
   re-dealt every few frames, so the warm part of the wake flickers
   between neighbouring characters the way a terminal redraw does.
   The cold field never flickers.

   Tokens: the ink is the hero's own text colour (--bg on the pink
   card), read from the canvas, so nothing new is defined globally.
   The face is Sometype Mono, the site's ASCII face. */

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
/* lightest to densest; the first is always a blank, the last three are drawn blocks */
const RAMP = [" ", ".", ":", "-", "=", "+", "*", "/", "%", "#", "\u2591", "\u2592", "\u2593"];
/* the resting field: the mascot's own characters, as before the wake */
/* each cell's grain: a small random step, 0..6 */
const rest = () => (Math.random() * 7) | 0;
/* below this much heat a cell is the field: a dot */
const COLD = 0.04;
/* how long a press's ring takes to spread and fade, s */
const RING_S = 2.2;
/* the knobs, in the component's own units */
const REACH = 50, TRAIL = 1.2;
/* ?ghost: the same mascot drawn again further down the page (behind the
   contact card), faint, assembling when it scrolls into view */
const GHOST = /ghost/.test(location.search);
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches);
/* the entrance: every cell flies in from a scattered start and lands;
   INTRO_S is the whole flight, each cell waits up to DELAY_S first */
const INTRO_S = 1.1, DELAY_S = 0.55;

const asciiArt = [
  "                                @@@@@@@@                        @@@@@@@@                            ",
  "                              @@@@@@@@@@@                      @@@@@@@@@@                           ",
  "                              @@@@@@@@@@@                     @@@@@@@@@@@                           ",
  "                              @@@@@@@@@@@                     @@@@@@@@@@@                           ",
  "                              @@@@@@@@@@                      @@@@@@@@@@@                           ",
  "                               @@@@@@@@                        @@@@@@@@@                            ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                     @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                                 ",
  "                              @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                            ",
  "                         @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                     ",
  "                     @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                 ",
  "                  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@             ",
  "               @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@          ",
  "             @@@@@@@@@@@@@@@@@@@@@@@@@@@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@        ",
  "           @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@      ",
  "          @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@     ",
  "        @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@   ",
  "      @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@  ",
  "     @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@    @@@@@@@@  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ ",
  "    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@       @@     @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "   @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@               @@@@@@@@@@@@   @@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                           @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  " @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                           @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  " @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                            @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                        @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                        @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                         @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                            @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                           @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                            @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ ",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@   @@@@@@@@@@@@               @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@  ",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@    @@@@      @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@   ",
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @@@@@@@@@    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@    ",
  " @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@   @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@     ",
  " @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@      ",
  "  @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@       ",
  "    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@         ",
  "     @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@           ",
  "       @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@             ",
  "         @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@               ",
  "            @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                   ",
  "                @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                      ",
  "                     @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                          ",
  "                                @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@                                    "
];

let width = 0, height = 0, dpr = 1;
/* the grid: one cell per character of the art */
const st = {
  cols: 0, rows: 0, cw: 0, ch: 0, ox: 0, oy: 0, font: '', fs: 0,
  /* the component was tuned on 6.2px cells; this scales its distances to ours */
  u: 1,
  /* the wake, one number per cell */
  heat: new Float32Array(0),
  /* how far inside the shape each cell is, 0 outside to 1 */
  mask: new Float32Array(0),
  /* each cell's resting character, dealt once and re-dealt now and then */
  base: [],
  /* each character's push away from the hand: offset and velocity, px */
  px: new Float32Array(0), py: new Float32Array(0), vx: new Float32Array(0), vy: new Float32Array(0), moving: false,
  /* the hand: where it is, where it was last stamped, and how
     present it is (for its own patch of heat, which follows it out) */
  hx: -9999, hy: -9999, lx: NaN, ly: NaN, near: 0, inside: false,
  /* rings going out from presses */
  rings: [],
  deal: 0, tick: 0, raf: 0,
  /* entrance clock (s since it started; -1 = not yet) and scroll dissolve 0..1 */
  it: -1, gone: 0
};

/* a stable 0..1 per cell per deal, so the shimmer is noise that
   holds for a few frames rather than flicker every frame */
function hash(k, n) {
  let h = (k * 374761393 + n * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* the grid for the block's size, cut to the mascot */
function init() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  width = canvas.parentElement ? canvas.parentElement.clientWidth : window.innerWidth;
  height = canvas.parentElement ? canvas.parentElement.clientHeight : window.innerHeight;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  const rows = asciiArt.length;
  let cols = 0;
  for (let r = 0; r < rows; r++) cols = Math.max(cols, asciiArt[r].length);
  const fs = Math.max(3, Math.min((width - 40) / cols * 1.5, (height - 40) / rows * 1.2));
  st.fs = fs; st.cols = cols; st.rows = rows;
  st.cw = fs * 0.58; st.ch = fs * 0.95;
  st.u = st.cw / 6.2;
  st.font = `500 ${fs}px 'Sometype Mono', monospace`;
  st.ox = (width - cols * st.cw) / 2;
  let bottomAlign = false;
  try { bottomAlign = parent.innerWidth < 1200; } catch (err) {}
  st.oy = bottomAlign ? (height - rows * st.ch) : (height - rows * st.ch) / 2;

  /* the shape, then its depth: a cell's share of filled neighbours,
     so the dots shrink toward the outline like a halftone and are
     fullest in the body */
  const b = new Uint8Array(cols * rows);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) b[j * cols + i] = (asciiArt[j][i] || ' ') !== ' ' ? 1 : 0;
  st.heat = new Float32Array(cols * rows);
  st.mask = new Float32Array(cols * rows);
  st.base = Uint8Array.from({ length: cols * rows }, rest);
  st.px = new Float32Array(cols * rows); st.py = new Float32Array(cols * rows);
  st.vx = new Float32Array(cols * rows); st.vy = new Float32Array(cols * rows);
  /* where each cell starts its entrance, and which way it leaves on scroll */
  st.sx = new Float32Array(cols * rows); st.sy = new Float32Array(cols * rows); st.dl = new Float32Array(cols * rows); st.an = new Float32Array(cols * rows);
  for (let k = 0; k < cols * rows; k++) { st.sx[k] = (Math.random() - 0.5) * width * 1.2; st.sy[k] = (Math.random() - 0.6) * height * 1.1; st.dl[k] = Math.random() * DELAY_S; st.an[k] = Math.random() * Math.PI * 2; }
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      if (!b[k]) continue;
      /* rows are taller than columns are wide, so the window is 5 wide, 3 tall */
      let n = 0, f = 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -2; di <= 2; di++) {
        const jj = j + dj, ii = i + di; n++;
        if (jj >= 0 && jj < rows && ii >= 0 && ii < cols) f += b[jj * cols + ii];
      }
      /* no cell lighter than a third of a full dot: the outline still
         reads as the mascot, and is still a field the wake can write on */
      st.mask[k] = 0.35 + 0.65 * clamp((f / n - 0.4) / 0.6, 0, 1);
    }
  }
  /* distance to the outline, in cell widths (rows count as ch/cw wide):
     a two-pass chamfer, cheap and good enough for shading */
  const ar = st.ch / st.cw, D = new Float32Array(cols * rows), BIG = 1e6;
  for (let k = 0; k < D.length; k++) D[k] = b[k] ? BIG : 0;
  const rd = (i, j) => (i < 0 || j < 0 || i >= cols || j >= rows) ? 0 : D[j * cols + i];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const k = j * cols + i; if (!D[k]) continue;
    D[k] = Math.min(D[k], rd(i - 1, j) + 1, rd(i, j - 1) + ar, rd(i - 1, j - 1) + Math.hypot(1, ar), rd(i + 1, j - 1) + Math.hypot(1, ar)); }
  for (let j = rows - 1; j >= 0; j--) for (let i = cols - 1; i >= 0; i--) { const k = j * cols + i; if (!D[k]) continue;
    D[k] = Math.min(D[k], rd(i + 1, j) + 1, rd(i, j + 1) + ar, rd(i + 1, j + 1) + Math.hypot(1, ar), rd(i - 1, j + 1) + Math.hypot(1, ar)); }
  /* height: a dome that rises fast at the edge and flattens inside */
  const R0 = 14, H = new Float32Array(D.length);
  for (let k = 0; k < D.length; k++) { const t = Math.min(1, D[k] / R0); H[k] = D[k] ? Math.sqrt(1 - (1 - t) * (1 - t)) : 0; }
  st.hgt = H;
  st.nx = new Float32Array(D.length); st.ny = new Float32Array(D.length); st.nz = new Float32Array(D.length);
  const hh = (i, j) => (i < 0 || j < 0 || i >= cols || j >= rows) ? 0 : H[j * cols + i];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = j * cols + i; if (!b[k]) continue;
    /* the slope, in units where a full rise over R0 cells is 1 */
    const gx = (hh(i + 1, j) - hh(i - 1, j)) * R0 / 2, gy = (hh(i, j + 1) - hh(i, j - 1)) * R0 / (2 * ar);
    const l = Math.hypot(gx, gy, 1);
    st.nx[k] = -gx / l; st.ny[k] = -gy / l; st.nz[k] = 1 / l;
  }
  tiles();
  paint();
}

/* ── THE BLOCKS ░ ▒ ▓ ─────────────────────────────────
   The densest steps are not font glyphs (most faces draw them with
   their own odd metrics): each is a small pattern drawn to fill its
   cell exactly, leaving a hairline between neighbours, so a dense
   patch reads as an even, woven surface. Built once per size, in the
   ink colour, at device resolution. */
function tiles() {
  const ink = getComputedStyle(canvas).color || '#141414';
  const W = Math.max(2, Math.round(st.cw * dpr)), Hh = Math.max(2, Math.round(st.ch * dpr));
  const p = Math.max(1, Math.round(st.cw * dpr / 5));
  const gap = Math.max(1, Math.round(dpr * 0.6));
  st.tile = [0, 1, 2].map((kind) => {
    const c = document.createElement('canvas'); c.width = W; c.height = Hh;
    const g = c.getContext('2d'); g.fillStyle = ink;
    for (let y = 0; y < Hh - gap; y += p) for (let x = 0; x < W - gap; x += p) {
      const a = (x / p) | 0, b = (y / p) | 0;
      /* each block is mostly ink with a regular screen of light left
         in it, so the three read as one even surface getting denser:
         ░ a checker (half), ▒ every other dot of every other row
         open (three quarters), ▓ a pinhole every third dot of every other row (five sixths) */
      const on = kind === 0 ? ((a + b) % 2 === 0)
               : kind === 1 ? !(b % 2 === 1 && a % 2 === 0)
               : !(b % 2 === 1 && a % 3 === 1);
      if (on) g.fillRect(x, y, Math.min(p, W - gap - x), Math.min(p, Hh - gap - y));
    }
    return c;
  });
}


/* heat dropped on the grid in a soft round at a point */
function stamp(x, y, rad, amt) {
  x -= st.ox; y -= st.oy;
  const c0 = Math.max(0, Math.floor((x - rad) / st.cw));
  const c1 = Math.min(st.cols - 1, Math.ceil((x + rad) / st.cw));
  const r0 = Math.max(0, Math.floor((y - rad) / st.ch));
  const r1 = Math.min(st.rows - 1, Math.ceil((y + rad) / st.ch));
  const R2 = rad * rad;
  for (let j = r0; j <= r1; j++) {
    const dy = (j + 0.5) * st.ch - y;
    for (let i = c0; i <= c1; i++) {
      const dx = (i + 0.5) * st.cw - x;
      const q = (dx * dx + dy * dy) / R2;
      if (q >= 1) continue;
      const t = 1 - q;
      const k = j * st.cols + i;
      st.heat[k] = Math.min(1, st.heat[k] + amt * t * t);
    }
  }
}

/* the wake's width: one cell's worth at 0, a broad swathe at 100 */
const radius = () => (12 + (clamp(REACH, 0, 100) / 100) * 58) * st.u;

function paint() {
  if (!st.cols) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  /* one ink for everything, the hero's own */
  ctx.fillStyle = getComputedStyle(canvas).color || '#141414';
  ctx.font = st.font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const top = RAMP.length - 1;
  const rad = radius();
  /* the light: upper left, leaning toward the hand while it is near */
  let Lx = -0.55, Ly = -0.6, Lz = 0.58;
  if (st.near > 0.002) {
    Lx += clamp((st.hx - width / 2) / width, -0.6, 0.6) * 1.4 * st.near;
    Ly += clamp((st.hy - height / 2) / height, -0.6, 0.6) * 1.4 * st.near;
  }
  const Ll = Math.hypot(Lx, Ly, Lz); Lx /= Ll; Ly /= Ll; Lz /= Ll;
  /* the hand's own heat, worked out fresh each frame rather than
     stored, so it never cools: a hand at rest keeps its patch */
  const R2 = rad * rad;
  /* the rings, as a band that passes rather than heat that stays:
     a press leaves nothing behind it, only the wave going out */
  const rings = st.rings.map((r) => {
    /* slow and smooth: it eases out as it spreads, a soft wide band
       that fades over its whole life rather than snapping off */
    const p = r.t / RING_S;
    const e = 1 - Math.pow(1 - p, 3);
    return { x: r.x, y: r.y, R: (8 + e * 260) * st.u, amp: 0.6 * (1 - p) * (1 - p) * Math.min(1, p * 6) };
  });
  const band = 24 * st.u;
  const intro = st.it < 0 ? 0 : Math.min(1, st.it / INTRO_S), gone = st.gone;
  ctx.globalAlpha = GHOST ? 1 : 1 - gone * 0.6;
  for (let j = 0; j < st.rows; j++) {
    const y = st.oy + (j + 0.5) * st.ch;
    for (let i = 0; i < st.cols; i++) {
      const k = j * st.cols + i;
      const m = st.mask[k];
      if (m <= 0) continue;
      const cx = st.ox + (i + 0.5) * st.cw;
      let h = st.heat[k];
      if (st.near > 0.002) {
        const q = ((cx - st.hx) ** 2 + (y - st.hy) ** 2) / R2;
        if (q < 1) h = Math.max(h, 0.95 * st.near * (1 - q) * (1 - q));
      }
      for (const r of rings) {
        /* a wide band, so the ring is a soft swell rather than a line */
        const d = (Math.hypot(cx - r.x, y - r.y) - r.R) / band;
        if (d > -2.5 && d < 2.5) h += r.amp * Math.exp(-d * d);
      }
      /* the body is one even surface of the same block, like the reference: no shadows, no noise */
      /* one tone, no shading: every resting cell is the same solid block */
      let lv = 12;
      /* the hand breaks the surface: warm cells fall apart into lighter
         glyphs, the way the reference star frays under the pointer */
      if (h > COLD) lv -= Math.round(Math.min(1, h) * 9 + (hash(k, st.deal) - 0.5) * 2);
      /* scrolling away, the mascot comes apart and drifts off */
      let x = cx + st.px[k], yy = y + st.py[k];
      if (gone > 0) {
        const g = Math.pow(gone, 1.4), r = (120 + st.dl[k] * 600) * st.u * g;
        x += Math.cos(st.an[k]) * r; yy += Math.sin(st.an[k]) * r * 0.7 + g * 140 * st.u;
        lv -= Math.round(gone * (6 + st.dl[k] * 14));
      }
      /* the entrance: in flight a cell is a dot; it lands as itself */
      if (intro < 1) {
        const e = clamp((intro * INTRO_S - st.dl[k]) / (INTRO_S - DELAY_S), 0, 1), q = 1 - Math.pow(1 - e, 3);
        x += st.sx[k] * (1 - q); yy += st.sy[k] * (1 - q);
        if (e < 0.92) lv = e > 0.6 ? 5 : 1;
      }
      const idx = clamp(lv, 0, top);
      if (idx < 1) continue;
      if (idx >= top - 2) { ctx.drawImage(st.tile[idx - (top - 2)], x - st.cw / 2, yy - st.ch / 2, st.cw, st.ch); continue; }
      ctx.fillText(RAMP[idx], x, yy);
    }
  }
}

/* the loop runs only while the wake is warm or the hand is moving */
function run() {
  if (st.raf) return;
  let prev = performance.now();
  const step = (t) => {
    /* rAF can hand a timestamp from just before prev: never step backwards */
    const dt = clamp((t - prev) / 1000, 0, 0.05);
    prev = t;
    /* the cooling: the same fraction off every cell, so a trail
       of seconds T is down to a twentieth after T */
    const keep = Math.exp((-dt * 3) / Math.max(0.1, TRAIL));
    let warm = 0;
    for (let k = 0; k < st.heat.length; k++) {
      const h = st.heat[k] * keep;
      st.heat[k] = h < 0.003 ? 0 : h;
      if (h > warm) warm = h;
    }
    /* the rings run outward for RING_S and are gone */
    st.rings = st.rings.filter((r) => (r.t += dt) < RING_S);
    /* the hand's presence follows it in and out */
    st.near += ((st.inside ? 1 : 0) - st.near) * (1 - Math.pow(0.004, dt));
    st.tick += dt;
    if (st.tick > 0.07) { st.tick = 0; st.deal++; }
    if (st.it >= 0 && st.it < INTRO_S) st.it += dt;
    push(dt);
    paint();
    const still = warm === 0 && !st.rings.length && !st.moving && !(st.it >= 0 && st.it < INTRO_S) && Math.abs((st.inside ? 1 : 0) - st.near) < 0.004;
    st.raf = still ? 0 : requestAnimationFrame(step);
  };
  st.raf = requestAnimationFrame(step);
}

/* ── RUNNING FROM THE HAND ─────────────────────────────
   Inside a round around the pointer every character is shoved
   straight away from it, harder the closer it is; a spring pulls
   it home and friction calms it, so the mascot parts around the
   hand and closes up behind it. Tuned per 60fps frame, scaled
   by the real frame time so it feels the same on any screen. */
const FLEE_R = 75, FLEE_F = 2.5, SPRING = 0.08, FRICTION = 0.85;
function push(dt) {
  const f = dt * 60, R = FLEE_R * st.u, damp = Math.pow(FRICTION, f);
  let moving = false;
  for (let j = 0; j < st.rows; j++) {
    const y0 = st.oy + (j + 0.5) * st.ch;
    for (let i = 0; i < st.cols; i++) {
      const k = j * st.cols + i;
      if (st.mask[k] <= 0) continue;
      const x = st.ox + (i + 0.5) * st.cw + st.px[k], y = y0 + st.py[k];
      if (st.inside) {
        const dx = st.hx - x, dy = st.hy - y, d = Math.hypot(dx, dy);
        if (d < R && d > 0.001) {
          const force = (R - d) / R;
          st.vx[k] -= (dx / d) * force * FLEE_F * f;
          st.vy[k] -= (dy / d) * force * FLEE_F * f;
        }
      }
      st.vx[k] = (st.vx[k] - st.px[k] * SPRING * f) * damp;
      st.vy[k] = (st.vy[k] - st.py[k] * SPRING * f) * damp;
      st.px[k] += st.vx[k] * f;
      st.py[k] += st.vy[k] * f;
      if (Math.abs(st.vx[k]) > 0.02 || Math.abs(st.vy[k]) > 0.02 || Math.abs(st.px[k]) > 0.05 || Math.abs(st.py[k]) > 0.05) moving = true;
      else { st.px[k] = 0; st.py[k] = 0; st.vx[k] = 0; st.vy[k] = 0; }
    }
  }
  st.moving = moving;
}

/* a press throws the characters near it outward, on top of the ring */
function burst(x, y) {
  const R = 90 * st.u;
  for (let j = 0; j < st.rows; j++) for (let i = 0; i < st.cols; i++) {
    const k = j * st.cols + i;
    if (st.mask[k] <= 0) continue;
    const dx = x - (st.ox + (i + 0.5) * st.cw), dy = y - (st.oy + (j + 0.5) * st.ch), d = Math.hypot(dx, dy);
    if (d < R && d > 0.001) { const force = (R - d) / R; st.vx[k] -= (dx / d) * force * 4; st.vy[k] -= (dy / d) * force * 4; }
  }
  st.moving = true;
}

/* the pointer in the block's own units — the page zooms on wide screens */
function where(e) {
  const r = canvas.getBoundingClientRect();
  const k = r.width / width || 1;
  return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
}

/* the hand stamps along the whole line since its last frame, a
   stamp every third of a radius, so a flick is one stroke */
function move(e) {
  const { x, y } = where(e);
  const rad = radius();
  if (Number.isNaN(st.lx)) { st.lx = x; st.ly = y; }
  const d = Math.hypot(x - st.lx, y - st.ly);
  const n = Math.max(1, Math.ceil(d / (rad / 3)));
  for (let k = 1; k <= n; k++) {
    const f = k / n;
    stamp(st.lx + (x - st.lx) * f, st.ly + (y - st.ly) * f, rad, 0.5);
  }
  st.lx = x; st.ly = y; st.hx = x; st.hy = y;
  st.inside = true;
  run();
}

canvas.addEventListener('pointerenter', (e) => { st.lx = NaN; move(e); });
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerleave', () => { st.inside = false; st.lx = NaN; run(); });
canvas.addEventListener('pointerdown', (e) => { const { x, y } = where(e); st.rings.push({ x, y, t: 0 }); burst(x, y); run(); });
window.addEventListener('resize', init);
/* the face may arrive after the first paint */
if (document.fonts && document.fonts.load) document.fonts.load(`500 12px 'Sometype Mono'`).then(() => paint());

/* ── ENTRANCE AND EXIT ──────────────────────────────
   The hero mascot assembles from scattered dots once the page is
   shown (after the preloader), and comes apart as the hero scrolls
   away, drifting down toward the next blocks; scrolling back up
   gathers it again. The ghost copy lower on the page assembles the
   first time it comes into view. Reduced motion: it is simply there. */
function begin() { if (st.it >= 0) return; if (RM) { st.it = INTRO_S; paint(); return; } st.it = 0; run(); }
if (GHOST) {
  try { new IntersectionObserver((es) => { if (es[0].isIntersecting) begin(); }, { threshold: 0.25 }).observe(canvas); } catch (err) { begin(); }
} else {
  const h = document.documentElement;
  if (h.classList.contains('pre-lock') && window.MutationObserver) {
    new MutationObserver((_, o) => { if (!h.classList.contains('pre-lock')) { o.disconnect(); setTimeout(begin, 120); } }).observe(h, { attributes: true, attributeFilter: ['class'] });
  } else setTimeout(begin, 120);
  if (!RM) {
    const hero = canvas.closest('.hero');
    let pend = 0;
    const onScroll = () => { if (!hero) return; const r = hero.getBoundingClientRect();
      const g = clamp(-r.top / (r.height * 0.75), 0, 1);
      if (Math.abs(g - st.gone) < 0.002) return; st.gone = g;
      if (!st.raf && !pend) pend = requestAnimationFrame(() => { pend = 0; paint(); }); };
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }
}
init();
</script>
