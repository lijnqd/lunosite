function init() {
  dpr = (window.devicePixelRatio || 1) * 2;
  width = container.clientWidth;
  height = container.clientHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  ctx.scale(dpr, dpr);
  ctx.textBaseline = 'alphabetic';
  ctx.imageSmoothingEnabled = false;

  chars.length = 0;

  const rows = asciiArt.length;
  let maxCols = 0;
  for (let r = 0; r < rows; r++) {
    if (asciiArt[r].length > maxCols) maxCols = asciiArt[r].length;
  }

  const fontSize = Math.min(width / maxCols * 1.7, height / rows * 1.1);
  const stepX = fontSize * 0.58;
  const stepY = fontSize * 0.95;

  const offsetX = (width - maxCols * stepX) / 2;
  const offsetY = (height - rows * stepY) / 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < asciiArt[r].length; c++) {
      const char = asciiArt[r][c];
      if (char !== ' ') {
        const x = offsetX + c * stepX;
        const y = offsetY + r * stepY;

        chars.push({
          char: getRandomChar(),
          x: x,
          y: y,
          originX: x,
          originY: y,
          vx: 0,
          vy: 0,
          fontSize: fontSize
        });
      }
    }
  }
}

let mouse = { x: -9999, y: -9999, radius: 40 };

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseleave', () => {
  mouse.x = -9999;
  mouse.y = -9999;
});

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;
  const clickRadius = 50;

  for (let i = 0; i < chars.length; i++) {
    const item = chars[i];
    const dx = clickX - item.x;
    const dy = clickY - item.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < clickRadius) {
      const angle = Math.atan2(dy, dx);
      const force = (clickRadius - dist) / clickRadius;
      item.vx -= Math.cos(angle) * force * 3;
      item.vy -= Math.sin(angle) * force * 3;
    }
  }
});

const resizeObserver = new ResizeObserver(() => {
  init();
});
resizeObserver.observe(container);

function animate() {
  ctx.clearRect(0, 0, width, height);

  for (let i = 0; i < chars.length; i++) {
    const item = chars[i];

    const dx = mouse.x - item.x;
    const dy = mouse.y - item.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < mouse.radius) {
      const angle = Math.atan2(dy, dx);
      const force = (mouse.radius - dist) / mouse.radius;
      item.vx -= Math.cos(angle) * force * 2;
      item.vy -= Math.sin(angle) * force * 2;
    }

    item.vx += (item.originX - item.x) * 0.14;
    item.vy += (item.originY - item.y) * 0.14;
    item.vx *= 0.8;
    item.vy *= 0.8;

    item.x += item.vx;
    item.y += item.vy;

    ctx.font = `500 ${item.fontSize}px 'Sometype Mono', monospace`;
    ctx.fillStyle = '#FFB3AD';
    ctx.fillText(item.char, item.x, item.y);
  }

  requestAnimationFrame(animate);
}

init();
animate();

        <script type="module">
            let height = 0

            function sendEmbedHeight() {
                window.parent.postMessage({
                    embedHeight: height
                }, "*")
            }

            const observer = new ResizeObserver((entries) => {
                if (entries.length !== 1) return
                const entry = entries[0]
                if (entry.target !== document.body) return

                height = entry.contentRect.height
                sendEmbedHeight()
            })

            observer.observe(document.body)

            window.addEventListener("message", (event) => {
                if (event.source !== window.parent) return
                if (event.data !== "getEmbedHeight") return
                sendEmbedHeight()
            })
        </script>
