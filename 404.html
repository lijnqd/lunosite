<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — lunö studio</title>
<meta name="description" content="This page doesn’t exist or has moved. Head back to the lunö studio homepage.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141414">
<link rel="icon" type="image/png" href="/assets/img/favicon-dark.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/assets/img/favicon-light.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css?v=1793023487">
<style>
.nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:110px 20px 120px;text-align:center;position:relative;z-index:1}
.nf canvas{display:block;width:min(900px,100%);height:auto;touch-action:none}
.nf p{font-size:18px;line-height:21.6px;letter-spacing:-.18px;max-width:340px}
@media (max-width:809px){.nf{gap:22px}.nf p{font-size:16px;line-height:19px}.header{left:12px;right:12px}}
</style>
</head>
<body>
<a class="skip" href="#content">skip to content</a>
<canvas id="dots"></canvas>
<header class="header">
  <a class="logo" href="/" aria-label="lunö"><img src="/assets/svg/logo.svg" alt="lunö"></a>
  <nav class="nav">
    <a href="/about/">#about</a><a href="/#services">#services</a><a href="/#cases">#cases</a><a href="/#faq">#faq</a><a href="/#contacts">#contact</a>
  </nav>
  <a class="btn btn-pink" href="/#contacts"><i></i>discuss a project</a>
</header>
<main id="content" class="nf">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">404 — page not found</h1>
  <canvas id="nf404" width="900" height="560" role="img" aria-label="404"></canvas>
  <p>Looks like this page hasn’t been designed yet, or it vanished into thin air</p>
  <a class="btn btn-pink" href="/"><i></i>back to home</a>
</main>
<script src="/js/cookies.js?v=5" defer></script>
<script src="/js/dotmorph.js?v=9" defer></script>
<script src="/js/track.js?v=1" defer></script>
<script src="/js/form.js?v=11" defer></script>
<script>
(function(){
// background dot glow (same as the main page)
var c=document.getElementById('dots'),x=c.getContext('2d'),mx=-999,my=-999,dpr=window.devicePixelRatio||1,W,H;
function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;draw()}
function draw(){x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);if(mx<0)return;var sy=scrollY,y0=30-(sy%60);for(var y=y0;y<H+4;y+=60){for(var px=30;px<W+4;px+=60){var d=Math.hypot(px-mx,y-my);if(d>170)continue;var t=1-d/170,a=.75*t*t;x.fillStyle='rgba(255,179,173,'+(.4*a).toFixed(3)+')';x.beginPath();x.arc(px,y,2.2,0,6.283);x.fill()}}}
addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;draw()});addEventListener('resize',size);size();

// ascii 404 (same style as the home cover)
var cv=document.getElementById('nf404'),ctx=cv.getContext('2d'),CW=900,CH=560,D=Math.min(devicePixelRatio||1,2),SYM='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+-/<>=?',items=[],mouse={x:-9999,y:-9999,r:75},started=0;
cv.width=CW*D;cv.height=CH*D;
function rc(){return SYM[Math.floor(Math.random()*SYM.length)]}
function build(){
  var o=document.createElement('canvas');o.width=CW;o.height=CH;var g=o.getContext('2d');
  g.fillStyle='#000';g.textBaseline='alphabetic';g.textAlign='center';
  var fs0=420;g.font='900 '+fs0+'px Inter, sans-serif';var tw=g.measureText('4Ö4').width;fs0=Math.floor(fs0*Math.min(1,(CW-60)/tw));g.font='900 '+fs0+'px Inter, sans-serif';g.fillText('4Ö4',CW/2,CH-50);
  var d=g.getImageData(0,0,CW,CH).data,fs=11,sx=fs*.58,sy=fs*.95;items=[];
  for(var y=sy;y<CH;y+=sy)for(var xx=0;xx<CW;xx+=sx){
    if(d[((Math.round(y-sy/2))*CW+Math.round(xx+sx/2))*4+3]>128)items.push({c:rc(),x:xx,y:y,ox:xx,oy:y,vx:0,vy:0})}
}
function frame(){
  ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,CW,CH);ctx.font="500 11px 'Sometype Mono', monospace";ctx.fillStyle='#FFB3AD';
  for(var i=0;i<items.length;i++){var t=items[i];
    if(Math.random()<.005)t.c=rc();
    var dx=mouse.x-t.x,dy=mouse.y-t.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<mouse.r){var a=Math.atan2(dy,dx),f=(mouse.r-dist)/mouse.r;t.vx-=Math.cos(a)*f*2.5;t.vy-=Math.sin(a)*f*2.5}
    t.vx+=(t.ox-t.x)*.08;t.vy+=(t.oy-t.y)*.08;t.vx*=.85;t.vy*=.85;t.x+=t.vx;t.y+=t.vy;
    ctx.fillText(t.c,t.x,t.y)}
  requestAnimationFrame(frame)}
function move(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;mouse.x=(t.clientX-r.left)*CW/r.width;mouse.y=(t.clientY-r.top)*CH/r.height}
function leave(){mouse.x=mouse.y=-9999}
cv.addEventListener('mousemove',move);cv.addEventListener('touchmove',move,{passive:true});cv.addEventListener('mouseleave',leave);cv.addEventListener('touchend',leave);
function start(){if(started)return;started=1;build();frame()}
Promise.all([document.fonts.load('900 100px Inter'),document.fonts.load("500 14px 'Sometype Mono'")]).then(start,start);setTimeout(start,1500);
})();
</script>
</body>
</html>
