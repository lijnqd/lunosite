<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — lunö studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141414">
<link rel="icon" type="image/png" href="/assets/img/favicon-dark.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/assets/img/favicon-light.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&family=Sometype+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:110px 20px 60px;text-align:center;position:relative;z-index:1}
.nf canvas{display:block;width:min(760px,100%);height:auto;touch-action:none}
.nf p{font-size:18px;line-height:21.6px;letter-spacing:-.18px;max-width:340px}
@media (max-width:809px){.nf{gap:22px}.nf p{font-size:16px;line-height:19px}.header{left:12px;right:12px}}
</style>
</head>
<body>
<canvas id="dots"></canvas>
<header class="header">
  <a class="logo" href="/" aria-label="lunö"><img src="/assets/svg/logo.svg" alt="lunö"></a>
  <nav class="nav">
    <a href="/#about">#about</a><a href="/#services">#services</a><a href="/#cases">#cases</a><a href="/#contacts">#contact</a>
  </nav>
  <a class="btn btn-pink" href="/#contacts"><i></i>book a call</a>
</header>
<main class="nf">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">404 — page not found</h1>
  <canvas id="nf404" width="760" height="470" role="img" aria-label="404"></canvas>
  <p>Looks like this page hasn’t been designed yet, or it vanished into thin air.</p>
  <a class="btn btn-pink" href="/"><i></i>back to home</a>
</main>
<script>
(function(){
// background dot glow (same as the main page)
var c=document.getElementById('dots'),x=c.getContext('2d'),mx=-999,my=-999,dpr=window.devicePixelRatio||1,W,H;
function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;draw()}
function draw(){x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);if(mx<0)return;var sy=scrollY,y0=30-(sy%60);for(var y=y0;y<H+4;y+=60){for(var px=30;px<W+4;px+=60){var d=Math.hypot(px-mx,y-my);if(d>170)continue;var t=1-d/170,a=.75*t*t;x.fillStyle='rgba(255,179,173,'+(.4*a).toFixed(3)+')';x.beginPath();x.arc(px,y,2.2,0,6.283);x.fill()}}}
addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;draw()});addEventListener('resize',size);size();

// dot-matrix 404
var cv=document.getElementById('nf404'),ctx=cv.getContext('2d'),CW=760,CH=470,P=6,R=2.85,pts=[],px=-999,py=-999,raf=0;
function build(){
  var o=document.createElement('canvas');o.width=CW;o.height=CH;var g=o.getContext('2d');
  g.fillStyle='#000';g.textBaseline='alphabetic';g.textAlign='left';
  var fs=385;g.font='900 '+fs+'px Inter, Helvetica, Arial, sans-serif';
  var w4=g.measureText('4').width,wO=g.measureText('O').width,tot=w4*2+wO,x0=(CW-tot)/2,base=CH-8;
  g.fillText('4',x0,base);g.fillText('O',x0+w4,base);g.fillText('4',x0+w4+wO,base);
  var cx=x0+w4+wO/2,dy=base-fs*.72-48;[-1,1].forEach(function(s){g.beginPath();g.arc(cx+s*wO*.27,dy,27,0,6.283);g.fill()});
  var d=g.getImageData(0,0,CW,CH).data;pts=[];
  for(var y=P/2;y<CH;y+=P)for(var xx=P/2;xx<CW;xx+=P){if(d[((y|0)*CW+(xx|0))*4+3]>128)pts.push([xx,y])}
}
function paint(){raf=0;ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#FFB3AD';
  for(var i=0;i<pts.length;i++){var p=pts[i],dx=p[0]-px,dy=p[1]-py,dd=Math.sqrt(dx*dx+dy*dy),s=1;if(dd<110){s=.3+.7*(dd/110)}
    ctx.beginPath();ctx.arc(p[0],p[1],R*s,0,6.283);ctx.fill()}}
function go(){if(!raf)raf=requestAnimationFrame(paint)}
function move(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;px=(t.clientX-r.left)*CW/r.width;py=(t.clientY-r.top)*CH/r.height;go()}
cv.addEventListener('mousemove',move);cv.addEventListener('touchmove',move,{passive:true});
cv.addEventListener('mouseleave',function(){px=py=-999;go()});
(document.fonts&&document.fonts.load?document.fonts.load('900 100px Inter').catch(function(){}):Promise.resolve()).then(function(){build();paint()});
})();
</script>
</body>
</html>
